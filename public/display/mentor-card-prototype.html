<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Mentor Card Display — Prototype</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    width: 100vw; height: 100vh; overflow: hidden;
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    background: #0f0c29;
  }

  /* ── Scene container ── */
  #scene {
    width: 100%; height: 100%;
    background: linear-gradient(145deg, #0f0c29 0%, #1a1a3e 60%, #0d1b2a 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 4vh 6vw;
    gap: 6vw;
    overflow: hidden;
    position: relative;
  }

  /* Ambient glow orb */
  .orb {
    position: absolute;
    border-radius: 50%;
    pointer-events: none;
  }
  .orb-1 {
    width: 40vw; height: 40vw;
    background: radial-gradient(circle, rgba(99,102,241,0.18) 0%, transparent 70%);
    top: -10%; right: -5%;
  }
  .orb-2 {
    width: 25vw; height: 25vw;
    background: radial-gradient(circle, rgba(245,158,11,0.10) 0%, transparent 70%);
    bottom: -8%; left: 5%;
  }

  /* ── Left panel ── */
  #left {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2vh;
    flex-shrink: 0;
    width: clamp(180px, 28vw, 340px);
    opacity: 0;
    transform: translateX(-40px);
    transition: opacity 0.55s ease, transform 0.55s cubic-bezier(0.34,1.26,0.64,1);
  }

  /* Photo circle */
  #photo-wrap {
    width: clamp(140px, 22vw, 260px);
    height: clamp(140px, 22vw, 260px);
    border-radius: 50%;
    overflow: hidden;
    border: 4px solid rgba(99,102,241,0.5);
    box-shadow: 0 0 60px rgba(99,102,241,0.3), 0 0 120px rgba(99,102,241,0.1);
    background: #1a1a3e;
    flex-shrink: 0;
  }
  #photo-wrap img {
    width: 100%; height: 100%;
    object-fit: cover;
    object-position: center 20%;
    display: block;
  }
  .initials-fallback {
    width: 100%; height: 100%;
    display: flex; align-items: center; justify-content: center;
    font-size: clamp(32px, 5vw, 64px);
    font-weight: 800;
    color: rgba(199,210,254,0.5);
    background: linear-gradient(135deg, #312e81, #1e1b4b);
  }

  #mentor-name {
    font-size: clamp(16px, 2.2vw, 30px);
    font-weight: 800;
    color: #fff;
    text-align: center;
    line-height: 1.2;
  }
  #mentor-id {
    font-size: clamp(11px, 1.2vw, 15px);
    color: rgba(199,210,254,0.45);
    font-family: ui-monospace, monospace;
    text-align: center;
    margin-top: -4px;
  }
  #mentor-badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: rgba(99,102,241,0.15);
    border: 1px solid rgba(99,102,241,0.3);
    border-radius: 99px;
    padding: 4px 14px;
    font-size: clamp(10px, 1vw, 13px);
    font-weight: 700;
    color: rgba(199,210,254,0.8);
    text-align: center;
  }
  #position {
    font-size: clamp(10px, 1vw, 13px);
    color: rgba(199,210,254,0.25);
    letter-spacing: 1px;
  }

  /* ── Divider ── */
  #divider {
    width: 1px;
    align-self: stretch;
    margin: 4vh 0;
    background: linear-gradient(to bottom, transparent, rgba(99,102,241,0.4), transparent);
    flex-shrink: 0;
    opacity: 0;
    transition: opacity 0.5s ease 0.15s;
  }

  /* ── Right panel ── */
  #right {
    flex: 1;
    min-width: 0;
    display: flex;
    flex-direction: column;
    gap: clamp(8px, 1.5vh, 18px);
    opacity: 0;
    transform: translateX(40px);
    transition: opacity 0.55s ease 0.1s, transform 0.55s cubic-bezier(0.34,1.26,0.64,1) 0.1s;
  }

  #mentees-label {
    font-size: clamp(10px, 1vw, 13px);
    font-weight: 700;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: rgba(199,210,254,0.35);
    margin-bottom: 0.5vh;
  }

  .mentee-row {
    display: flex;
    align-items: center;
    gap: clamp(10px, 1.5vw, 20px);
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.07);
    border-radius: 14px;
    padding: clamp(10px, 1.5vh, 16px) clamp(14px, 2vw, 22px);
    opacity: 0;
    transform: translateX(20px);
    transition: opacity 0.4s ease, transform 0.4s ease;
  }

  .mentee-num {
    width: clamp(28px, 3vw, 40px);
    height: clamp(28px, 3vw, 40px);
    border-radius: 50%;
    background: rgba(99,102,241,0.18);
    border: 1.5px solid rgba(99,102,241,0.4);
    display: flex; align-items: center; justify-content: center;
    font-size: clamp(11px, 1.2vw, 15px);
    font-weight: 800;
    color: #a5b4fc;
    flex-shrink: 0;
  }
  .mentee-name {
    font-size: clamp(14px, 1.8vw, 22px);
    font-weight: 700;
    color: #fff;
  }
  .mentee-sid {
    font-size: clamp(10px, 1vw, 13px);
    color: rgba(199,210,254,0.4);
    font-family: ui-monospace, monospace;
    margin-top: 2px;
  }

  /* ── Nav buttons ── */
  #nav {
    position: fixed;
    bottom: 3vh;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 14px;
    align-items: center;
    z-index: 10;
  }
  .nav-btn {
    background: rgba(255,255,255,0.08);
    border: 1.5px solid rgba(255,255,255,0.15);
    color: #fff;
    font-size: 14px;
    font-weight: 700;
    padding: 10px 24px;
    border-radius: 99px;
    cursor: pointer;
    transition: background 0.15s, border-color 0.15s, transform 0.15s;
    letter-spacing: 0.5px;
    backdrop-filter: blur(4px);
  }
  .nav-btn:hover:not(:disabled) {
    background: rgba(99,102,241,0.25);
    border-color: rgba(99,102,241,0.6);
    transform: translateY(-2px);
  }
  .nav-btn:disabled { opacity: 0.3; cursor: not-allowed; }
  #counter {
    font-size: 13px;
    font-weight: 700;
    color: rgba(199,210,254,0.5);
    min-width: 48px;
    text-align: center;
  }

  /* ── Animations ── */
  .visible #left, .visible #right { opacity: 1; transform: translateX(0); }
  .visible #divider { opacity: 1; }
  .mentee-row.in { opacity: 1; transform: translateX(0); }

  @keyframes pulse-ring {
    0%   { box-shadow: 0 0 0 0 rgba(99,102,241,0.4), 0 0 60px rgba(99,102,241,0.3); }
    70%  { box-shadow: 0 0 0 12px rgba(99,102,241,0), 0 0 60px rgba(99,102,241,0.3); }
    100% { box-shadow: 0 0 0 0 rgba(99,102,241,0), 0 0 60px rgba(99,102,241,0.3); }
  }
  #photo-wrap { animation: pulse-ring 3s ease-in-out infinite; }
</style>
</head>
<body>

<div id="scene">
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>

  <!-- Left: Mentor -->
  <div id="left">
    <div id="photo-wrap">
      <img id="mentor-photo" src="" alt="" />
    </div>
    <div id="mentor-name">—</div>
    <div id="mentor-id">—</div>
    <div id="mentor-badge">—</div>
    <div id="position">— / —</div>
  </div>

  <!-- Divider -->
  <div id="divider"></div>

  <!-- Right: Mentees -->
  <div id="right">
    <div id="mentees-label">Assigned Mentees</div>
    <div id="mentees-list"></div>
  </div>
</div>

<!-- Navigation -->
<div id="nav">
  <button class="nav-btn" id="btn-prev" onclick="go(-1)">← Prev</button>
  <span id="counter">1 / 3</span>
  <button class="nav-btn" id="btn-next" onclick="go(1)">Next →</button>
</div>

<script>
const DATA = [
  {
    name:    "Ashan Perera",
    id:      "TG/2024/0001",
    batch:   "9th",
    comm:    "WhatsApp",
    photo:   "/profile/mentor/Renamed_Photos/2061.jpeg",
    mentees: [
      { name: "Kavindi Wickramasinghe", sid: "TG/IT/2025/0001" },
      { name: "Pasindu Fernando",       sid: "TG/IT/2025/0002" },
    ]
  },
  {
    name:    "Hasini Rathnayake",
    id:      "TG/2024/0008",
    batch:   "9th",
    comm:    "WhatsApp",
    photo:   "/profile/mentor/Renamed_Photos/2080.jpg",
    mentees: [
      { name: "Nethmi Perera",   sid: "TG/IT/2025/0003" },
      { name: "Ravindu Senanayake", sid: "TG/IT/2025/0004" },
    ]
  },
  {
    name:    "Sachini Weerasinghe",
    id:      "TG/2024/0019",
    batch:   "9th",
    comm:    "WhatsApp",
    photo:   "/profile/mentor/Renamed_Photos/2092.jpeg",
    mentees: [
      { name: "Dilani Rathnayake", sid: "TG/IT/2025/0005" },
    ]
  },
];

let current = 0;
let animTimeout = null;

function show(idx) {
  const scene = document.getElementById("scene");
  const m = DATA[idx];

  // Reset animation state
  scene.classList.remove("visible");
  document.querySelectorAll(".mentee-row").forEach(r => r.classList.remove("in"));

  // Update photo
  const photoEl = document.getElementById("mentor-photo");
  if (m.photo) {
    photoEl.src = m.photo;
    photoEl.style.display = "block";
    document.querySelector(".initials-fallback")?.remove();
  } else {
    photoEl.style.display = "none";
    const wrap = document.getElementById("photo-wrap");
    let fb = wrap.querySelector(".initials-fallback");
    if (!fb) { fb = document.createElement("div"); fb.className = "initials-fallback"; wrap.appendChild(fb); }
    fb.textContent = m.name.split(" ").map(w=>w[0]).slice(0,2).join("");
  }

  document.getElementById("mentor-name").textContent = m.name;
  document.getElementById("mentor-id").textContent   = m.id;
  document.getElementById("mentor-badge").textContent = `${m.batch} · ${m.comm}`;
  document.getElementById("position").textContent     = `${idx + 1} / ${DATA.length}`;
  document.getElementById("counter").textContent      = `${idx + 1} / ${DATA.length}`;

  // Build mentee rows
  const list = document.getElementById("mentees-list");
  list.innerHTML = "";
  m.mentees.forEach((mentee, i) => {
    const row = document.createElement("div");
    row.className = "mentee-row";
    row.innerHTML = `
      <div class="mentee-num">${i + 1}</div>
      <div>
        <div class="mentee-name">${mentee.name}</div>
        <div class="mentee-sid">${mentee.sid}</div>
      </div>`;
    list.appendChild(row);
  });

  // Trigger animations
  if (animTimeout) clearTimeout(animTimeout);
  animTimeout = setTimeout(() => {
    scene.classList.add("visible");
    // Stagger mentee rows
    document.querySelectorAll(".mentee-row").forEach((row, i) => {
      row.style.transitionDelay = `${0.25 + i * 0.12}s`;
      setTimeout(() => row.classList.add("in"), (0.25 + i * 0.12) * 1000);
    });
  }, 60);

  // Nav buttons
  document.getElementById("btn-prev").disabled = idx === 0;
  document.getElementById("btn-next").disabled = idx === DATA.length - 1;
}

function go(dir) {
  current = Math.max(0, Math.min(DATA.length - 1, current + dir));
  show(current);
}

// Initial render
show(0);
</script>
</body>
</html>

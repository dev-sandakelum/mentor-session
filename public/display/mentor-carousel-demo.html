<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#05070f" />
  <title>Mentor Carousel — Demo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; overflow: hidden; }

    body {
      font-family: "Sora", "Inter", system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
      background: #05070f;
      color: #eef5ff;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    /* ── background layer ── */
    #bg {
      position: fixed; inset: 0; overflow: hidden;
      background:
        radial-gradient(120% 120% at 15% 0%,  #0d2a66 0%, transparent 55%),
        radial-gradient(120% 120% at 100% 100%, #0a1c3d 0%, transparent 55%),
        linear-gradient(160deg, #060a1c 0%, #0a1230 55%, #04060f 100%);
    }
    #bg canvas { position: absolute; inset: 0; }
    .aurora {
      position: absolute; border-radius: 50%;
      filter: blur(70px); opacity: .55; mix-blend-mode: screen;
    }
    .a1 {
      width: 46vw; height: 46vw; top: -14%; right: -8%;
      background: radial-gradient(circle, rgba(59,130,246,.9) 0%, transparent 68%);
      animation: mc-drift1 24s ease-in-out infinite;
    }
    .a2 {
      width: 40vw; height: 40vw; bottom: -16%; left: -6%;
      background: radial-gradient(circle, rgba(56,189,248,.6) 0%, transparent 68%);
      animation: mc-drift2 28s ease-in-out infinite;
    }
    .a3 {
      width: 34vw; height: 34vw; top: 30%; left: 42%;
      background: radial-gradient(circle, rgba(34,211,238,.35) 0%, transparent 68%);
      animation: mc-drift3 32s ease-in-out infinite;
    }
    #bg-grid {
      position: absolute; inset: -2px;
      background-image:
        linear-gradient(rgba(255,255,255,.035) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.035) 1px, transparent 1px);
      background-size: 60px 60px;
      -webkit-mask-image: radial-gradient(120% 90% at 50% 40%, #000 30%, transparent 75%);
              mask-image: radial-gradient(120% 90% at 50% 40%, #000 30%, transparent 75%);
    }
    #bg-vignette {
      position: absolute; inset: 0;
      background: radial-gradient(120% 120% at 50% 45%, transparent 55%, rgba(0,0,0,.6) 100%);
    }

    /* ── header ── */
    header {
      position: relative; z-index: 2; flex-shrink: 0;
      display: flex; justify-content: space-between; align-items: center;
      padding: clamp(18px,3vh,32px) clamp(18px,4vw,40px) 0;
      font-family: "Space Grotesk", sans-serif;
      font-size: clamp(11px,1.1vw,14px);
      letter-spacing: .14em; text-transform: uppercase;
      color: #c7d2fe; opacity: .7;
    }
    #live-badge {
      display: inline-flex; align-items: center; gap: 8px;
    }
    #live-dot {
      width: 6px; height: 6px; border-radius: 50%;
      background: #22d3ee; box-shadow: 0 0 10px #22d3ee;
      animation: mc-live 2s ease-out infinite;
    }

    /* ── stage ── */
    #stage {
      position: relative; z-index: 2;
      flex: 1; min-height: 0;
      perspective: 1500px;
      perspective-origin: 50% 40%;
      user-select: none; -webkit-user-select: none;
      display: flex; align-items: center; justify-content: center;
      overflow: visible;
    }
    #stage-inner { position: relative; width: 0; height: 0; }

    /* ── card ── */
    .card {
      position: absolute; top: 0; left: 0;
      --card-w: clamp(280px, 38vw, 420px);
      --card-h: clamp(340px, 44vw, 500px);
      --shift:  clamp(200px, 32vw, 360px);
      width: var(--card-w);
      transform-origin: 50% 40%;
      will-change: transform, opacity, filter;
      cursor: pointer;
      transition:
        transform 0.72s cubic-bezier(.25,.46,.45,.94),
        opacity   0.72s cubic-bezier(.25,.46,.45,.94),
        filter    0.72s cubic-bezier(.25,.46,.45,.94);
    }
    .card.no-anim { transition: none !important; }

    /* slot positions */
    .card[data-slot="center"] {
      transform: translateX(calc(var(--card-w) / -2)) translateY(-50%) translate3d(0,0,0) rotateY(0deg) scale(1);
      opacity: 1; filter: none; z-index: 10; cursor: default;
    }
    .card[data-slot="right"] {
      transform: translateX(calc(var(--card-w) / -2)) translateY(-50%) translate3d(var(--shift),0,-200px) rotateY(-16deg) scale(0.70);
      opacity: .82; filter: saturate(.75) brightness(.85); z-index: 5;
    }
    .card[data-slot="left"] {
      transform: translateX(calc(var(--card-w) / -2)) translateY(-50%) translate3d(calc(var(--shift)*-1),0,-200px) rotateY(16deg) scale(0.70);
      opacity: .82; filter: saturate(.75) brightness(.85); z-index: 5;
    }
    .card[data-slot="hidden-right"] {
      transform: translateX(calc(var(--card-w) / -2)) translateY(-50%) translate3d(calc(var(--shift)*1.8),0,-400px) rotateY(-26deg) scale(0.48);
      opacity: 0; z-index: 1; pointer-events: none;
    }
    .card[data-slot="hidden-left"] {
      transform: translateX(calc(var(--card-w) / -2)) translateY(-50%) translate3d(calc(var(--shift)*-1.8),0,-400px) rotateY(26deg) scale(0.48);
      opacity: 0; z-index: 1; pointer-events: none;
    }

    /* ── photo box ── */
    .card__photo {
      position: relative; width: 100%; height: var(--card-h);
      border-radius: 28px; overflow: hidden;
      background: linear-gradient(180deg, #274a8a 0%, #1c3766 100%);
      transition: box-shadow 0.72s cubic-bezier(.25,.46,.45,.94);
    }
    .card[data-slot="center"] .card__photo {
      box-shadow:
        0 60px 130px -26px rgba(0,0,0,.95),
        0 0 0 1px rgba(255,255,255,.16),
        0 0 100px -14px rgba(59,130,246,.85);
    }
    .card:not([data-slot="center"]) .card__photo {
      box-shadow: 0 32px 70px -20px rgba(0,0,0,.8), 0 0 0 1px rgba(255,255,255,.09);
    }
    .card__photo img {
      width: 100%; height: 100%; object-fit: cover;
      object-position: center 20%; display: block;
    }
    .card__photo .shade {
      position: absolute; inset: 0; z-index: 1;
      background: rgba(4,6,14,.45);
      transition: opacity 0.72s cubic-bezier(.25,.46,.45,.94);
    }
    .card[data-slot="center"] .card__photo .shade { opacity: 0; }
    .card__photo .grad {
      position: absolute; inset: 0;
      background: linear-gradient(to bottom, rgba(6,10,25,.1) 0%, transparent 35%, rgba(6,10,25,.6) 100%);
      pointer-events: none;
    }
    /* initials fallback */
    .card__initials {
      width: 100%; height: 100%;
      display: flex; align-items: center; justify-content: center;
      font-size: clamp(52px,8vw,96px); font-weight: 800;
      color: transparent;
      background: linear-gradient(135deg, #93c5fd, #dbeafe 50%, #bfdbfe);
      -webkit-background-clip: text; background-clip: text;
    }

    /* batch badge on side cards */
    .card__badge {
      position: absolute; bottom: 16px; left: 50%;
      transform: translateX(-50%);
      display: inline-flex; align-items: center; gap: 6px; white-space: nowrap;
      background: linear-gradient(120deg, #3b82f6, #2563eb);
      border: 1px solid rgba(255,255,255,.25); border-radius: 99px;
      padding: 8px 18px;
      font-family: "Space Grotesk", sans-serif;
      font-size: clamp(12px,1.15vw,15px); font-weight: 600; color: #fff;
      box-shadow: 0 14px 30px -12px rgba(37,99,235,.9), inset 0 1px 0 rgba(255,255,255,.3);
      z-index: 2;
      transition: opacity 0.72s cubic-bezier(.25,.46,.45,.94), transform 0.72s cubic-bezier(.25,.46,.45,.94);
    }
    .card[data-slot="center"] .card__badge { opacity: 0; transform: translateX(-50%) translateY(20px); }

    /* ── info panel (grid expand) ── */
    .card__expand {
      display: grid;
      grid-template-rows: 0fr;
      transition: grid-template-rows 0.72s cubic-bezier(.25,.46,.45,.94);
    }
    .card[data-slot="center"] .card__expand { grid-template-rows: 1fr; }
    .card__expand-inner { overflow: hidden; min-height: 0; }
    .card__panel {
      position: relative; margin-top: 16px;
      background: linear-gradient(160deg, rgba(30,58,138,.32), rgba(10,16,40,.5));
      backdrop-filter: blur(18px) saturate(140%);
      -webkit-backdrop-filter: blur(18px) saturate(140%);
      border-radius: 20px; padding: 20px 24px 22px;
      box-shadow: 0 24px 50px -26px rgba(0,0,0,.7), inset 0 1px 0 rgba(255,255,255,.08);
      opacity: 0; transform: translateY(-8px) scale(.98);
      transition:
        opacity 0.38s cubic-bezier(.25,.46,.45,.94),
        transform 0.72s cubic-bezier(.25,.46,.45,.94);
    }
    .card[data-slot="center"] .card__panel {
      opacity: 1; transform: translateY(0) scale(1);
      transition-delay: .08s;
    }
    .card__panel::before {
      content: ""; position: absolute; inset: 0; border-radius: 20px; padding: 1.2px;
      background: conic-gradient(from 45deg, #3b82f6, #22d3ee, #6366f1, #38bdf8, #3b82f6);
      -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
      -webkit-mask-composite: xor; mask-composite: exclude;
      opacity: .5; pointer-events: none;
    }
    .card__meta {
      font-family: "Space Grotesk", ui-monospace, monospace;
      font-size: clamp(11px,1vw,14px); letter-spacing: .12em;
      text-transform: uppercase; color: #c7d2fe; opacity: .75;
      margin-bottom: 12px;
      display: flex; justify-content: space-between;
    }
    .card__name {
      font-family: "Sora", sans-serif;
      font-size: clamp(22px,2.4vw,32px); font-weight: 700;
      letter-spacing: -.4px; line-height: 1.15; margin-bottom: 6px;
      color: #fff; text-shadow: 0 2px 20px rgba(59,130,246,.3);
    }
    .card__sub {
      font-family: "Space Grotesk", sans-serif;
      font-size: clamp(13px,1.25vw,17px); color: #38bdf8;
      font-weight: 600; letter-spacing: .04em;
    }

    /* ── dots + counter ── */
    #controls {
      position: relative; z-index: 3;
      display: flex; align-items: center; justify-content: center;
      gap: 18px;
      padding: 0 18px clamp(18px,4vh,36px);
    }
    #dots { display: flex; gap: 7px; flex-wrap: wrap; justify-content: center; }
    .dot {
      height: 4px; border-radius: 2px;
      background: rgba(199,210,254,.18);
      cursor: pointer;
      transition: width .4s cubic-bezier(.25,.46,.45,.94), background .3s, box-shadow .3s;
      width: 20px;
    }
    .dot.active {
      width: 32px;
      background: linear-gradient(90deg, #3b82f6, #22d3ee);
      box-shadow: 0 0 14px rgba(59,130,246,.75);
    }
    .nav-btn {
      width: 40px; height: 40px; border-radius: 50%;
      border: 1px solid rgba(255,255,255,.12);
      background: rgba(255,255,255,.05);
      color: #eef5ff; cursor: pointer;
      display: grid; place-items: center;
      backdrop-filter: blur(10px);
      transition: background .3s, transform .2s, border-color .3s;
    }
    .nav-btn:hover {
      background: rgba(59,130,246,.22);
      border-color: rgba(59,130,246,.5);
      transform: translateY(-1px);
    }
    .nav-btn:active { transform: scale(.94); }
    .nav-btn svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    #counter {
      font-family: "Space Grotesk", ui-monospace, monospace;
      font-size: 11px; letter-spacing: .12em;
      color: #c7d2fe; opacity: .6;
      min-width: 5ch; text-align: center;
      font-variant-numeric: tabular-nums;
    }

    /* ── keyframes ── */
    @keyframes mc-drift1 { 0%,100%{transform:translate(0,0) scale(1)} 50%{transform:translate(-6vw,5vh) scale(1.12)} }
    @keyframes mc-drift2 { 0%,100%{transform:translate(0,0) scale(1)} 50%{transform:translate(7vw,-4vh) scale(1.15)} }
    @keyframes mc-drift3 { 0%,100%{transform:translate(0,0) scale(1)} 50%{transform:translate(-5vw,-6vh) scale(.85)} }
    @keyframes mc-live   { 0%,100%{box-shadow:0 0 10px #22d3ee} 50%{box-shadow:0 0 18px #22d3ee,0 0 30px rgba(34,211,238,.4)} }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; }
      .card { transition-duration: .2s !important; }
    }
    @media (max-width: 600px) {
      .card { --shift: clamp(140px,40vw,200px); }
    }
  </style>
</head>
<body>

<!-- background -->
<div id="bg">
  <canvas id="particle-canvas"></canvas>
  <div class="aurora a1"></div>
  <div class="aurora a2"></div>
  <div class="aurora a3"></div>
  <div id="bg-grid"></div>
  <div id="bg-vignette"></div>
</div>

<!-- header -->
<header>
  <span>Mentor Session</span>
  <div id="live-badge">
    <span id="live-dot"></span>
    <span>Autoplay</span>
  </div>
  <span>2026</span>
</header>

<!-- carousel stage -->
<div id="stage">
  <div id="stage-inner"></div>
</div>

<!-- dots + nav -->
<div id="controls">
  <button class="nav-btn" id="btn-prev" aria-label="Previous">
    <svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg>
  </button>
  <div id="dots"></div>
  <span id="counter">01 / 43</span>
  <button class="nav-btn" id="btn-next" aria-label="Next">
    <svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg>
  </button>
</div>

<script>
// ── Mentor data (from seed-mentors-real.ts) ─────────────────────────────────
const P = '/profile/mentor/Renamed_Photos';
const MENTORS = [
  { name: "Amjad Hassan",           last4: "2061", photo: `${P}/2061.jpeg` },
  { name: "Udaya Madubashana",      last4: "2063", photo: `${P}/2063.jpg`  },
  { name: "Ruvisha Lakmina",        last4: "2064", photo: `${P}/2064.jpg`  },
  { name: "Senitha Samarasinghe",   last4: "2066", photo: `${P}/2066.jpeg` },
  { name: "Dasindu Dilvan",         last4: "2067", photo: `${P}/2067.jpg`  },
  { name: "Thisaru Thiwanka",       last4: "2069", photo: `${P}/2069.jpg`  },
  { name: "Gihan Kavindu",          last4: "2071", photo: `${P}/2071.jpg`  },
  { name: "Hasitha Sandakelum",     last4: "2073", photo: `${P}/2073.jpeg` },
  { name: "W. Hiruni Chethana",     last4: "2074", photo: `${P}/2074.jpeg` },
  { name: "M. L. Omethra Thisagi",  last4: "2075", photo: `${P}/2075.jpg`  },
  { name: "Vishwa Pramuditha",      last4: "2077", photo: `${P}/2077.jpeg` },
  { name: "Nadeera Nethmina",       last4: "2078", photo: `${P}/2078.jpeg` },
  { name: "Tharuka Perera",         last4: "2079", photo: `${P}/2079.jpeg` },
  { name: "Sudeshika Sandeepani",   last4: "2080", photo: `${P}/2080.jpg`  },
  { name: "Bineth Vindinu",         last4: "2083", photo: `${P}/2083.jpg`  },
  { name: "Kaveesh Bandara",        last4: "2084", photo: `${P}/2084.jpg`  },
  { name: "Dilush Bandara",         last4: "2085", photo: `${P}/2085.jpeg` },
  { name: "Minula Kudarachchi",     last4: "2086", photo: `${P}/2086.jpg`  },
  { name: "Vishwa Dasun",           last4: "2087", photo: `${P}/2087.jpeg` },
  { name: "Chirath Miyuru",         last4: "2089", photo: `${P}/2089.jpeg` },
  { name: "Nithila Kithnula",       last4: "2090", photo: `${P}/2090.png`  },
  { name: "Vinuthi Abeywardana",    last4: "2091", photo: `${P}/2091.jpg`  },
  { name: "Hansika Devindi",        last4: "2092", photo: `${P}/2092.jpeg` },
  { name: "Hasaranga KHM",          last4: "2095", photo: `${P}/2095.jpeg` },
  { name: "Nirmal Sasindu",         last4: "2097", photo: `${P}/2097.jpg`  },
  { name: "Dilmi Ishara",           last4: "2100", photo: `${P}/2100.jpeg` },
  { name: "Praveen Sandeepa",       last4: "2106", photo: `${P}/2106.jpg`  },
  { name: "Dilshan Madhusankha",    last4: "2109", photo: `${P}/2109.jpg`  },
  { name: "Tashiru Dissanayaka",    last4: "2110", photo: `${P}/2110.jpg`  },
  { name: "Hasindu Nethsara",       last4: "2111", photo: `${P}/2111.jpeg` },
  { name: "Sahan Buddhika",         last4: "2114", photo: `${P}/2114.jpg`  },
  { name: "W. L. Bhashitha",        last4: "2115", photo: `${P}/2115.jpeg` },
  { name: "Wimukthi Weerasinghe",   last4: "2117", photo: `${P}/2117.jpeg` },
  { name: "Naveen Nethmal",         last4: "2121", photo: `${P}/2121.jpg`  },
  { name: "Nirasha Weerawardhana",  last4: "2123", photo: `${P}/2123.jpg`  },
  { name: "Abhisheka Sankalpani",   last4: "2125", photo: `${P}/2125.jpg`  },
  { name: "Chamindu Dilhara",       last4: "2126", photo: `${P}/2126.jpg`  },
  { name: "M. A. Aysha",            last4: "2128", photo: `${P}/2128.jpg`  },
  { name: "Sachin Shehan",          last4: "2131", photo: `${P}/2131.jpeg` },
  { name: "Chamod Kalhara",         last4: "2139", photo: `${P}/2139.jpg`  },
  { name: "Pasidu Prasad",          last4: "2143", photo: `${P}/2143.jpeg` },
  { name: "Isindu Anjana",          last4: "2144", photo: `${P}/2144.jpg`  },
  { name: "Nadula Ranathunga",      last4: "2147", photo: `${P}/2147.jpeg` },
];

const TOTAL    = MENTORS.length;
const INTERVAL = 3500;
const pad = n => String(n).padStart(2, '0');
const initials = n => n.split(' ').slice(0, 2).map(w => w[0]).join('').toUpperCase();

// ── DOM build ──────────────────────────────────────────────────────────────
const stageInner = document.getElementById('stage-inner');
const dotsEl     = document.getElementById('dots');
const counterEl  = document.getElementById('counter');

const cards = MENTORS.map((m, i) => {
  const card = document.createElement('div');
  card.className = 'card no-anim';
  card.dataset.index = i;

  card.innerHTML = `
    <div class="card__photo">
      <img src="${m.photo}" alt="${m.name}" loading="lazy" />
      <div class="shade"></div>
      <div class="grad"></div>
      <div class="card__badge">9th Batch</div>
    </div>
    <div class="card__expand">
      <div class="card__expand-inner">
        <div class="card__panel">
          <div class="card__meta">
            <span>[${pad(i + 1)}]</span>
            <span>${i + 1} / ${TOTAL}</span>
          </div>
          <div class="card__name">${m.name}</div>
          <div class="card__sub">9th Batch · TG/2024/${m.last4}</div>
        </div>
      </div>
    </div>`;

  // fallback: swap broken img → initials div
  const img = card.querySelector('img');
  img.addEventListener('error', () => {
    const fb = document.createElement('div');
    fb.className = 'card__initials';
    fb.textContent = initials(m.name);
    img.replaceWith(fb);
  });

  // click side cards to jump
  card.addEventListener('click', () => {
    const slot = card.dataset.slot;
    if (slot !== 'center') goTo(i);
  });

  stageInner.appendChild(card);
  return card;
});

const dots = MENTORS.map((_, i) => {
  const d = document.createElement('div');
  d.className = 'dot';
  d.addEventListener('click', () => goTo(i));
  dotsEl.appendChild(d);
  return d;
});

// ── Slot logic ─────────────────────────────────────────────────────────────
const mid = Math.floor(TOTAL / 2);
function slotFor(offset) {
  if (offset === 0)              return 'center';
  if (offset === 1)              return 'right';
  if (offset === TOTAL - 1)      return 'left';
  return offset <= mid ? 'hidden-right' : 'hidden-left';
}

// ── State ──────────────────────────────────────────────────────────────────
let active = 0;
let timer  = null;
let hovering = false;

function render() {
  cards.forEach((card, i) => {
    const offset  = (i - active + TOTAL) % TOTAL;
    const prevSlot = card.dataset.slot;
    const nextSlot = slotFor(offset);

    // teleport cards jumping between hidden slots without animating across stage
    if (prevSlot && prevSlot.startsWith('hidden') && nextSlot.startsWith('hidden') && prevSlot !== nextSlot) {
      card.classList.add('no-anim');
      card.dataset.slot = nextSlot;
      void card.offsetWidth;
      card.classList.remove('no-anim');
    } else {
      card.dataset.slot = nextSlot;
    }
  });

  dots.forEach((d, i) => {
    d.classList.toggle('active', i === active);
  });

  counterEl.textContent = `${pad(active + 1)} / ${pad(TOTAL)}`;
}

function goTo(i) {
  active = i;
  render();
  reschedule();
}
function next() { active = (active + 1) % TOTAL; render(); }
function prev() { active = (active - 1 + TOTAL) % TOTAL; render(); }

function reschedule() {
  clearTimeout(timer);
  if (!hovering) timer = setTimeout(() => { next(); reschedule(); }, INTERVAL);
}

// ── Controls ───────────────────────────────────────────────────────────────
document.getElementById('btn-next').addEventListener('click', () => { next(); reschedule(); });
document.getElementById('btn-prev').addEventListener('click', () => { prev(); reschedule(); });

// pause on hover
const stage = document.getElementById('stage');
stage.addEventListener('pointerenter', e => { if (e.pointerType === 'mouse') { hovering = true; clearTimeout(timer); } });
stage.addEventListener('pointerleave', e => { if (e.pointerType === 'mouse') { hovering = false; reschedule(); } });

// keyboard
window.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight') { next(); reschedule(); }
  else if (e.key === 'ArrowLeft') { prev(); reschedule(); }
});

// swipe
let sx = null, sy = null;
stage.addEventListener('pointerdown', e => { if (e.pointerType !== 'mouse') { sx = e.clientX; sy = e.clientY; } });
stage.addEventListener('pointerup', e => {
  if (sx === null) return;
  const dx = e.clientX - sx, dy = e.clientY - sy;
  sx = sy = null;
  if (Math.abs(dx) > 40 && Math.abs(dx) > Math.abs(dy)) { dx < 0 ? next() : prev(); reschedule(); }
});

// ── Particle canvas ────────────────────────────────────────────────────────
(function particles() {
  const canvas = document.getElementById('particle-canvas');
  const ctx    = canvas.getContext('2d');
  let W, H, pts;

  function resize() {
    W = canvas.width  = canvas.offsetWidth;
    H = canvas.height = canvas.offsetHeight;
  }
  function mkPt() {
    return {
      x: Math.random() * W, y: Math.random() * H,
      r: Math.random() * 1.4 + 0.3,
      vx: (Math.random() - 0.5) * 0.18,
      vy: (Math.random() - 0.5) * 0.18,
      a: Math.random() * 0.5 + 0.1,
    };
  }
  function init() { resize(); pts = Array.from({ length: 90 }, mkPt); }
  function draw() {
    ctx.clearRect(0, 0, W, H);
    pts.forEach(p => {
      p.x += p.vx; p.y += p.vy;
      if (p.x < 0 || p.x > W) p.vx *= -1;
      if (p.y < 0 || p.y > H) p.vy *= -1;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(147,197,253,${p.a})`;
      ctx.fill();
    });
    requestAnimationFrame(draw);
  }
  window.addEventListener('resize', () => { resize(); });
  init(); draw();
})();

// ── Boot ───────────────────────────────────────────────────────────────────
// first paint: no animation, then enable transitions
render();
requestAnimationFrame(() => requestAnimationFrame(() => {
  cards.forEach(c => c.classList.remove('no-anim'));
  reschedule();
}));
</script>
